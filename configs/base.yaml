# Scholar-R1 base config — the source of truth for hyperparameters.
# Loaded by scholarrl.config.load_config(); scripts build the env via build_env(),
# so editing a value here actually takes effect (unknown keys fail loudly).

corpus:
  # subset corpus difficulty knob: how many distractor papers per gold paper
  distractor_ratio: 10         # random distractors per gold; 10 = closer to realistic difficulty (was 5, too easy -> inflated baseline)
  hard_negative_topk: 20       # RESERVED for Phase 2 (BM25 hard negatives); not applied by build_corpus yet
  include_random_distractors: true  # false -> gold-only corpus (debug)

retriever:
  kind: bm25                   # bm25 (V1) | dense (V2, drop-in)
  top_k: 10                    # results returned per <search> (5 -> 10: scripts.ceiling shows
                               # the ceiling rising 18% -> 23% on the raw question; beyond 20 the
                               # gain is small next to the observation-length cost in GRPO)

env:
  # search and read used to share ONE budget, so reading ate 6 of every 8 turns and only
  # ~3 searches were left -> only 16.4% of gold was ever surfaced. Separate budgets stop
  # reading from starving the only action that can grow the candidate pool.
  max_search_turns: 6          # how many <search> calls (grows the candidate pool)
  max_read_turns: 10           # how many <read> calls (inspects candidates)
  max_steps: 30                # hard cap on total steps (16 expensive + selects + finish)
  max_consecutive_invalid: 2   # 0 = off; ends the episode when the model stops emitting
                               # actions and just repeats prose (12/50 dev episodes did this)
  dedup_queries: true
  abstract_max_words: 256      # abstracts truncated by whitespace-split words (matches env)

reward:
  metric: recall               # recall | f1
  k: 20
  lambda_fmt: 0.1              # format bonus (stabilizes small models)
  # Phase 3 cost-aware terms (0 = off for now)
  alpha_search_cost: 0.0
  beta_token_cost: 0.0

model:
  name: Qwen/Qwen2.5-3B-Instruct       # main; use 0.5B for smoke tests
  lora_rank: 32                        # LoRA is required on single A100 (no full fine-tune)

grpo:
  group_size: 8                # 80GB: 8 · 40GB: drop to 4-5
  kl_coef: 0.001
  lr: 1.0e-6
  train_subset: 1000           # sampled from train.jsonl (33551 total)

seed: 42
